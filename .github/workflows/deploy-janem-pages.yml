name: Deploy Jane.M Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "JaneM_Website/**"
      - "scripts/build-seo-site.js"
      - "scripts/validate-seo.js"
      - "package.json"
      - ".github/workflows/deploy-janem-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build and validate SEO site
        run: |
          npm run build
          npm run test:seo

      - name: Upload Jane.M website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./JaneM_Website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
